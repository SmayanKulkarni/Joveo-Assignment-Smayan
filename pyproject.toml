[project]
name = "talent-scout"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph==1.2.18",
    "langgraph-checkpoint-sqlite==3.1.2",
    "langchain-core==1.7.2",
    "langchain-openrouter==0.2.9",
    "langchain-typesafe==0.0.1a3",
    "langsmith==0.14.16",
    "pydantic==2.14.2",
    "pydantic-settings",
    "httpx==0.28.1",
    "rich>=15.0.0",
    "aiosqlite==0.22.1",
]

[project.scripts]
scout = "talent_scout.clients.cli:main"

[dependency-groups]
dev = ["pytest"]
streamlit = [
    "streamlit>=1.66.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talent_scout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
